<!doctype html>
<html lang="en" class="ps-unified ps-subject-page" data-subject="clock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7FAFC">
<meta name="description" content="Primary Steps Clock: choose a picture to start learning and playing.">
<title>Clock • Primary Steps</title>


<script src="assets/js/ps-settings.js"></script>
<link rel="stylesheet" href="assets/css/primary-steps.css?v=4">
<link rel="stylesheet" href="assets/css/subject-menu.css?v=1">
<script src="assets/js/primary-steps.js?v=4" defer></script>
<script src="assets/js/subject-menu.js?v=1" defer></script>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="favicon.ico?v=20261023">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/primary-steps-favicon-v2.svg?v=20261023">
</head>
<body>
<main class="ps-subject-main">
<section class="ps-subject-hero" aria-labelledby="subject-title">
<div class="ps-subject-hero__copy">
<span class="ps-subject-hero__eyebrow">LET'S LEARN</span>
<h1 id="subject-title">Clock</h1>
<p>Pick a picture to start.</p>
<button class="ps-subject-hero__listen" type="button" data-ps-listen="telling the time" aria-label="Hear instructions for Clock">🔊 Listen</button>
</div>
<div class="ps-subject-hero__art" aria-hidden="true"><svg viewBox="0 0 280 210" focusable="false"><use href="assets/learning-activity-illustrations.svg#ps-set-time"></use></svg></div>
</section>
<section aria-labelledby="choose-title">
<h2 class="ps-subject-title" id="choose-title">Choose an activity</h2>
<div class="ps-choice-grid" style="--ps-grid-columns:2">
<a class="ps-choice" href="./clock-play.html?activity=set" aria-label="Open Set the Time">
<svg class="ps-choice__picture" aria-hidden="true" focusable="false" viewBox="0 0 280 210"><use href="assets/learning-activity-illustrations.svg#ps-set-time"></use></svg>
<span class="ps-choice__footer"><span class="ps-choice__name">Set the Time</span><span class="ps-choice__arrow" aria-hidden="true">→</span></span>
</a>
<a class="ps-choice" href="./clock-play.html?activity=read" aria-label="Open Read the Clock">
<svg class="ps-choice__picture" aria-hidden="true" focusable="false" viewBox="0 0 280 210"><use href="assets/learning-activity-illustrations.svg#ps-read-time"></use></svg>
<span class="ps-choice__footer"><span class="ps-choice__name">Read the Clock</span><span class="ps-choice__arrow" aria-hidden="true">→</span></span>
</a>
</div>
</section>
<footer class="ps-subject-footer">Go at your own pace. <a href="settings.html">Parent settings</a></footer>
</main>
