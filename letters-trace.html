<!doctype html>
<html lang="en" class="ps-unified ps-game" data-game="trace">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7FAFC">
<title>Trace Letters • Primary Steps</title>
<meta name="description" content="Practise tracing large letters at your own pace.">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="favicon.ico?v=20261023">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/primary-steps-favicon-v2.svg?v=20261023">
<script src="assets/js/ps-settings.js"></script>
<link rel="stylesheet" href="assets/css/primary-steps.css?v=4">
<link rel="stylesheet" href="assets/css/learning-game.css?v=1">
<script src="assets/js/primary-steps.js?v=4" defer></script>
<script src="assets/js/learning-game.js?v=1" defer></script>
</head>
<body>
<main class="ps-trace-main">
<section class="ps-trace-board" aria-labelledby="trace-title">
<div class="ps-trace-head">
 <div><h1 id="trace-title">✏️ Trace the letter</h1><p>Follow the letter with your finger.</p></div>
 <div class="ps-trace-letter" aria-live="polite" aria-atomic="true">Letter <span id="letter">A</span></div>
</div>
<div class="ps-trace-canvaswrap">
 <canvas id="c" aria-label="Large letter tracing board. Use a finger, mouse or stylus."></canvas>
 <p class="ps-game-count-note">No timer. Take your time.</p>
</div>
<div class="ps-trace-controls">
 <button class="btn" id="prev" type="button">← Back</button>
 <button class="btn" id="clear" type="button">↻ Clear</button>
 <button class="ps-game-listen" id="listen" type="button" data-ps-read="Trace the letter A. Follow the shape slowly.">🔊 Listen</button>
 <button class="btn primary" id="next" type="button">Next →</button>
</div>
</section>
</main>
<script>
(function(){
 "use strict";
 const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
 let index=0,painting=false,last=null;
 const canvas=document.getElementById("c");
 const ctx=canvas.getContext("2d");
 const label=document.getElementById("letter");
 const listen=document.getElementById("listen");
 function sizeBoard(){
   const rect=canvas.getBoundingClientRect();
   const ratio=Math.min(2,window.devicePixelRatio||1);
   canvas.width=Math.max(1,Math.round(rect.width*ratio));
   canvas.height=Math.max(1,Math.round(rect.height*ratio));
   ctx.setTransform(ratio,0,0,ratio,0,0);
 }
 function guide(){
   const w=canvas.getBoundingClientRect().width,h=canvas.getBoundingClientRect().height;
   ctx.clearRect(0,0,w,h);
   const size=Math.min(w*.67,h*.75);
   const x=w/2,y=h/2;
   ctx.save();
   ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.font="900 "+size+"px 'Arial Black','Trebuchet MS',system-ui,sans-serif";
   ctx.fillStyle="rgba(110,192,180,.16)";
   ctx.fillText(alphabet[index],x,y);
   ctx.setLineDash([Math.max(10,size*.038),Math.max(9,size*.034)]);
   ctx.lineWidth=Math.max(5,size*.018);
   ctx.strokeStyle="#428D87";
   ctx.lineCap="round";
   ctx.strokeText(alphabet[index],x,y);
   ctx.restore();
 }
 function setLetter(i){
   index=(i+alphabet.length)%alphabet.length;
   label.textContent=alphabet[index];
   listen.setAttribute("data-ps-read","Trace the letter "+alphabet[index]+". Follow the shape slowly.");
   painting=false;last=null;sizeBoard();guide();
 }
 function coordinates(e){
   const r=canvas.getBoundingClientRect();
   return {x:e.clientX-r.left,y:e.clientY-r.top};
 }
 function start(e){
   if(e.pointerType==="mouse"&&e.button!==0)return;
   e.preventDefault();painting=true;
   try{canvas.setPointerCapture(e.pointerId)}catch(_){}
   last=coordinates(e);
   ctx.fillStyle="#277D91";ctx.beginPath();ctx.arc(last.x,last.y,6,0,Math.PI*2);ctx.fill();
 }
 function move(e){
   if(!painting||!last)return;
   e.preventDefault();const here=coordinates(e);
   ctx.save();ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(here.x,here.y);
   ctx.lineWidth=12;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#277D91";ctx.stroke();ctx.restore();
   last=here;
 }
 function end(){painting=false;last=null}
 canvas.addEventListener("pointerdown",start);
 canvas.addEventListener("pointermove",move);
 canvas.addEventListener("pointerup",end);
 canvas.addEventListener("pointercancel",end);
 window.addEventListener("pointerup",end);
 document.getElementById("prev").addEventListener("click",()=>setLetter(index-1));
 document.getElementById("next").addEventListener("click",()=>setLetter(index+1));
 document.getElementById("clear").addEventListener("click",()=>setLetter(index));
 window.addEventListener("resize",()=>setLetter(index));
 setLetter(0);
})();
</script>
</body></html>
