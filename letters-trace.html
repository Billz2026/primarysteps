<!doctype html>
<html lang="en" class="ps-unified ps-game" data-game="trace">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7FAFC">
<title>Trace Letters • Primary Steps</title>
<meta name="description" content="Practise tracing large letters at your own pace.">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="favicon.ico?v=20261023">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/primary-steps-favicon-v2.svg?v=20261023">
<script src="assets/js/ps-settings.js?v=2"></script>
<link rel="stylesheet" href="assets/css/primary-steps.css?v=8">
<link rel="stylesheet" href="assets/css/learning-game.css?v=1">
<script src="assets/js/primary-steps.js?v=8" defer></script>
<script src="assets/js/learning-game.js?v=1" defer></script>
<style>
html.ps-game .ps-trace-status{margin:12px 2px 0;padding:10px 15px;border-radius:13px;background:#ECF8F2;color:#235D62;font-size:17px;font-weight:800}
html.ps-game .ps-trace-options{padding:0 22px 18px;margin:0;font-size:14px;color:#446879}
html.ps-game .ps-trace-options summary{cursor:pointer;font-weight:800;min-height:33px;max-width:280px}
html.ps-game .ps-trace-options button{margin-top:7px;min-height:48px;padding:9px 15px;border:2px solid #A6D8CA;background:#F1FAF7;color:#285C65;border-radius:13px;font-weight:850;cursor:pointer}
html.ps-game #c{cursor:crosshair}
@media(max-width:650px){html.ps-game .ps-trace-status{font-size:15px}html.ps-game .ps-trace-controls button{flex:1 1 calc(50% - 10px)!important}}
</style>
</head>
<body>
<main class="ps-trace-main">
<section class="ps-trace-board" aria-labelledby="trace-title">
<div class="ps-trace-head">
 <div><h1 id="trace-title">✏️ Trace the letter</h1><p>Follow the letter with your finger.</p></div>
 <div class="ps-trace-letter" aria-live="polite" aria-atomic="true">Letter <span id="letter">A</span></div>
</div>
<div class="ps-trace-canvaswrap">
 <canvas id="c" aria-label="Trace uppercase letter A" aria-describedby="trace-help"></canvas>
 <p class="ps-game-count-note" id="trace-help">Draw over the dotted letter with your finger or mouse. No timer.</p>
<p class="ps-trace-status" id="trace-status" role="status" aria-live="polite">Trace the letter A.</p>
</div>
<div class="ps-trace-controls">
 <button class="btn" id="prev" type="button">← Previous</button>
 <button class="btn" id="clear" type="button">↻ Clear</button>
 <button class="ps-game-listen" id="listen" type="button" data-ps-read="Trace the letter A. Follow the shape slowly.">🔊 Listen</button>
 <button class="btn primary" id="next" type="button">Next →</button>
</div>
<details class="ps-trace-options"><summary>Grown-ups: letter case</summary><button id="case-toggle" type="button" aria-pressed="false">Use lowercase letters (a–z)</button></details>
</section>
</main>
<script>
(function(){
 "use strict";
 const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
 let index=0,lowercase=false,activePointer=null,last=null,drawn=false;
 const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
 const label=document.getElementById("letter");
 const listen=document.getElementById("listen");
 const status=document.getElementById("trace-status");
 const caseBtn=document.getElementById("case-toggle");
 if(!ctx){status.textContent="This device cannot open the tracing board.";return;}
 function currentLetter(){return lowercase?alphabet[index].toLowerCase():alphabet[index];}
 function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const ratio=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.max(1,Math.round(rect.width*ratio));
  canvas.height=Math.max(1,Math.round(rect.height*ratio));
  ctx.setTransform(ratio,0,0,ratio,0,0);
 }
 function drawGuide(){
  const w=canvas.getBoundingClientRect().width,h=canvas.getBoundingClientRect().height;
  ctx.clearRect(0,0,w,h);
  const size=Math.min(w*.67,h*.75);
  ctx.save();
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="900 "+size+"px 'Arial Black','Trebuchet MS',system-ui,sans-serif";
  ctx.fillStyle="rgba(110,192,180,.16)";
  ctx.fillText(currentLetter(),w/2,h/2);
  ctx.setLineDash([Math.max(10,size*.038),Math.max(9,size*.034)]);
  ctx.lineWidth=Math.max(5,size*.018);
  ctx.strokeStyle="#428D87";ctx.lineCap="round";
  ctx.strokeText(currentLetter(),w/2,h/2);
  ctx.restore();
 }
 function updateLabel(){
  const char=currentLetter();
  label.textContent=char;
  canvas.setAttribute("aria-label","Trace "+(lowercase?"lowercase":"uppercase")+" letter "+char);
  listen.setAttribute("data-ps-read","Trace the letter "+char+". Follow the dotted shape with your finger. You can take your time.");
  caseBtn.textContent=lowercase?"Use uppercase letters (A–Z)":"Use lowercase letters (a–z)";
  caseBtn.setAttribute("aria-pressed",String(lowercase));
 }
 function resetBoard(){
  activePointer=null;last=null;drawn=false;
  updateLabel();resizeCanvas();drawGuide();
  status.textContent="Trace the letter "+currentLetter()+".";
 }
 function setLetter(i){index=(i+alphabet.length)%alphabet.length;resetBoard();}
 function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
 function pointerDown(e){
  if(activePointer!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();activePointer=e.pointerId;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  last=point(e);drawn=true;
  ctx.fillStyle="#277D91";ctx.beginPath();ctx.arc(last.x,last.y,6,0,Math.PI*2);ctx.fill();
 }
 function pointerMove(e){
  if(activePointer!==e.pointerId||last===null)return;
  e.preventDefault();
  const here=point(e);ctx.save();ctx.beginPath();ctx.moveTo(last.x,last.y);
  ctx.lineTo(here.x,here.y);ctx.lineWidth=12;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="#277D91";ctx.stroke();ctx.restore();last=here;
 }
 function pointerEnd(e){
  if(activePointer!==e.pointerId)return;
  activePointer=null;last=null;
  if(drawn)status.textContent="Keep tracing, or tap Next when you are ready.";
 }
 function preserveOnResize(){
  if(activePointer!==null)return;
  if(!drawn){resizeCanvas();drawGuide();return;}
  const snapshot=document.createElement("canvas");
  snapshot.width=canvas.width;snapshot.height=canvas.height;
  snapshot.getContext("2d").drawImage(canvas,0,0);
  resizeCanvas();
  const rect=canvas.getBoundingClientRect();
  ctx.drawImage(snapshot,0,0,rect.width,rect.height);
 }
 canvas.addEventListener("pointerdown",pointerDown);
 canvas.addEventListener("pointermove",pointerMove);
 canvas.addEventListener("pointerup",pointerEnd);
 canvas.addEventListener("pointercancel",pointerEnd);
 window.addEventListener("pointerup",pointerEnd);
 window.addEventListener("pointercancel",pointerEnd);
 document.getElementById("prev").addEventListener("click",()=>setLetter(index-1));
 document.getElementById("next").addEventListener("click",()=>setLetter(index+1));
 document.getElementById("clear").addEventListener("click",resetBoard);
 caseBtn.addEventListener("click",()=>{lowercase=!lowercase;resetBoard()});
 window.addEventListener("resize",preserveOnResize);
 resetBoard();
})();
</script>
</body></html>
