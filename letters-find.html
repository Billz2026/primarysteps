<!doctype html>
<html lang="en" class="ps-unified ps-letter-premium" data-letter-game="find">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7FAFC">
<meta name="description" content="Find and match large, clear letters. Calm, accessible letter recognition for children.">
<title>Find the Letter • Primary Steps</title>
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="favicon.ico?v=20261023">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/primary-steps-favicon-v2.svg?v=20261023">
<script src="assets/js/ps-settings.js?v=2"></script>
<link rel="stylesheet" href="assets/css/primary-steps.css?v=8">
<link rel="stylesheet" href="assets/css/letters-premium.css?v=1">
<script src="assets/js/primary-steps.js?v=9" defer></script>
</head>
<body>
<main class="pl-main">
<section class="pl-board" aria-labelledby="pl-title">
 <div class="pl-heading">
  <div><span class="pl-eyebrow">Primary Steps · Letters</span>
   <h1 id="pl-title">Find the Letter</h1>
   <p>Look at the big letter. Find the one that matches.</p>
  </div>
  <span class="pl-heading__tag" aria-hidden="true">ABC</span>
 </div>
 <div class="pl-body">
  <h2 class="pl-task-label" id="pl-task">Find this letter</h2>
  <div class="pl-target" id="pl-target" aria-label="Find the letter A">A</div>
  <div class="pl-speak-area">
   <button type="button" class="pl-button pl-button--audio" id="pl-hear">🔊 Hear the letter</button>
   <span class="pl-voice-note" id="pl-voice-note" role="status"></span>
  </div>
  <h2 class="pl-choice-label">Tap the matching letter</h2>
  <div class="pl-choices" id="pl-choices" role="group" aria-label="Choose the matching letter"></div>
  <div class="pl-feedback" id="pl-feedback" data-state="neutral" role="status" aria-live="polite">Choose the letter that matches.</div>
  <div class="pl-footer">
   <span class="pl-footer__hint">No timer. Take your time.</span>
   <button type="button" class="pl-button pl-button--primary" id="pl-next">Next letter →</button>
  </div>
  <details class="pl-settings" id="pl-settings">
   <summary>Grown-ups: level</summary>
   <label for="pl-level">Number of choices in full mode</label>
   <select id="pl-level"><option value="easy">Easy · 4 letters</option><option value="medium">Medium · 6 letters</option><option value="hard">Hard · 9 letters</option></select>
  </details>
 </div>
</section>
<nav class="pl-nav" aria-label="Letters activities">
 <a href="letters-trace.html">✏️ Trace Letters</a>
 <a href="letters-find.html" aria-current="page">🔎 Find Letters</a>
 <a href="letters-sounds.html">🔊 Letter Sounds</a>
</nav>
</main>
<script>
(function(){
 "use strict";
 const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
 const beginner=["A","B","C","M","S","T"];
 const target=document.getElementById("pl-target");
 const choices=document.getElementById("pl-choices");
 const feedback=document.getElementById("pl-feedback");
 const next=document.getElementById("pl-next");
 const hear=document.getElementById("pl-hear");
 const voiceNote=document.getElementById("pl-voice-note");
 const level=document.getElementById("pl-level");
 let current="",solved=false;
 function simple(){return window.PSSettings?.load?.().simplePlay!==false}
 function pick(items){return items[Math.floor(Math.random()*items.length)]}
 function shuffle(items){
  const arr=items.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
 }
 function message(state,text){feedback.dataset.state=state;feedback.textContent=text}
 function newRound(){
  const bank=simple()?beginner:alphabet;
  current=pick(bank.filter(letter=>letter!==current));
  solved=false;
  target.textContent=current;
  target.setAttribute("aria-label","Find the letter "+current);
  hear.setAttribute("aria-label","Hear the letter "+current);
  voiceNote.textContent="";
  const count=simple()?3:({easy:4,medium:6,hard:9}[level.value]||4);
  const others=shuffle(bank.filter(letter=>letter!==current)).slice(0,count-1);
  const options=shuffle([current,...others]);
  choices.replaceChildren();
  options.forEach(letter=>{
   const button=document.createElement("button");
   button.type="button";button.className="pl-choice";
   button.textContent=letter;button.setAttribute("aria-label","Letter "+letter);
   button.addEventListener("click",function(){
    if(solved)return;
    if(letter===current){
     solved=true;button.classList.add("is-correct");
     choices.querySelectorAll("button").forEach(b=>b.disabled=true);
     message("correct","⭐ Well done! You found "+current+".");
    }else{
     button.classList.add("is-incorrect");
     message("try","Have another look. Try again.");
    }
   });
   choices.appendChild(button);
  });
  message("neutral","Choose the letter that matches.");
 }
 hear.addEventListener("click",function(){
  if(!window.PSVoice){voiceNote.textContent="Speech unavailable.";return}
  window.PSVoice.speak("Find the letter "+current+". Tap the matching letter.",voiceNote);
 });
 next.addEventListener("click",newRound);
 level.addEventListener("change",newRound);
 newRound();
})();
</script>
</body>
</html>
