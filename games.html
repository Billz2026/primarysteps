<svg class="ps-choice__picture" aria-hidden="true" focusable="false" viewBox="0 0 280 210"><use href="assets/learning-activity-illustrations.svg#ps-connect-four"></use></svg>

<a class="ps-choice" href="game-sudoku.html" aria-label="Open Sudoku">
